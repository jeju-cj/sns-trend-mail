name: SNS Trend Screenshot

on:
  workflow_dispatch:

  schedule:
    # 한국시간 월요일 09:10
    - cron: '10 0 * * 1'

    # 한국시간 목요일 09:10
    - cron: '10 0 * * 4'

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download screenshot
        env:
          ACCESS_KEY: ${{ secrets.SCREENSHOTONE_ACCESS_KEY }}
        run: |
          URL="https://api.screenshotone.com/take?access_key=${ACCESS_KEY}&url=https%3A%2F%2Fclaude.ai%2Fartifact%2F661fBc9hrzkFAv3JvS8E7V&format=jpg&block_ads=true&block_cookie_banners=true&block_banners_by_heuristics=false&block_trackers=true&delay=0&timeout=60&response_type=by_format&image_quality=80&clip_x=690&clip_y=45&clip_width=560&clip_height=850"

          curl --fail --location "$URL" --output sns-trend.jpg

          file sns-trend.jpg
          test -s sns-trend.jpg

      - name: Save screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sns-trend.jpg
          git commit -m "Update SNS trend screenshot" || true
          git push
