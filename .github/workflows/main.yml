name: SNS Trend Screenshot

on:
  workflow_dispatch:

  schedule:
    # 한국시간 월요일 09:10
    - cron: '10 0 * * 1'

    # 한국시간 목요일 09:10
    - cron: '10 0 * * 4'

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download full screenshot
        env:
          ACCESS_KEY: ${{ secrets.SCREENSHOTONE_ACCESS_KEY }}
        run: |
          curl --fail --location \
            --get "https://api.screenshotone.com/take" \
            --data-urlencode "access_key=${ACCESS_KEY}" \
            --data-urlencode "url=https://claude.ai/artifact/661fBc9hrzkFAv3JvS8E7V" \
            --data-urlencode "format=jpg" \
            --data-urlencode "block_ads=true" \
            --data-urlencode "block_cookie_banners=true" \
            --data-urlencode "block_banners_by_heuristics=false" \
            --data-urlencode "block_trackers=true" \
            --data-urlencode "delay=2" \
            --data-urlencode "timeout=60" \
            --data-urlencode "response_type=by_format" \
            --data-urlencode "image_quality=90" \
            --data-urlencode "cache=false" \
            --output full-screenshot.jpg

      - name: Install image tools
        run: |
          python -m pip install --quiet pillow

      - name: Auto crop card news
        run: |
          python <<'PY'
          from PIL import Image

          img = Image.open("full-screenshot.jpg").convert("RGB")
          w, h = img.size

          # Find the large dark card area.
          # Ignore the top browser/header area.
          dark_points = []

          for y in range(50, h):
              for x in range(w):
                  r, g, b = img.getpixel((x, y))

                  if r < 45 and g < 45 and b < 45:
                      dark_points.append((x, y))

          if not dark_points:
              raise RuntimeError("Dark card area was not detected.")

          xs = [p[0] for p in dark_points]
          ys = [p[1] for p in dark_points]

          card_left = min(xs)
          card_right = max(xs)
          card_top = min(ys)
          card_bottom = max(ys)

          # Add margins around the detected card
          # to include title/date above and navigation/note below.
          left = max(0, card_left - 35)
          right = min(w, card_right + 35)
          top = max(0, card_top - 90)
          bottom = min(h, card_bottom + 135)

          print("Full image:", w, "x", h)
          print("Detected card:",
                card_left, card_top,
                card_right, card_bottom)
          print("Crop:",
                left, top,
                right, bottom)

          cropped = img.crop((left, top, right, bottom))
          cropped.save(
              "sns-trend.jpg",
              "JPEG",
              quality=90,
              optimize=True
          )

          print("Final image:", cropped.size)
          PY

      - name: Save screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sns-trend.jpg
          git commit -m "Update SNS trend screenshot" || true
          git push
