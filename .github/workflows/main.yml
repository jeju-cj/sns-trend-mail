name: SNS Trend Screenshot

on:
  workflow_dispatch:

  schedule:
    # 한국시간 월요일 09:10
    - cron: '10 0 * * 1'

    # 한국시간 목요일 09:10
    - cron: '10 0 * * 4'

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Take screenshot with ScreenshotOne
        env:
          SCREENSHOTONE_ACCESS_KEY: ${{ secrets.SCREENSHOTONE_ACCESS_KEY }}
        run: |
          curl --fail --location \
            --get "https://api.screenshotone.com/take" \
            --data-urlencode "access_key=${SCREENSHOTONE_ACCESS_KEY}" \
            --data-urlencode "url=https://claude.ai/artifact/661fBc9hrzkFAv3JvS8E7V" \
            --data-urlencode "format=jpg" \
            --data-urlencode "viewport_width=1440" \
            --data-urlencode "viewport_height=1100" \
            --data-urlencode "device_scale_factor=1" \
            --data-urlencode "full_page=false" \
            --data-urlencode "clip_x=690" \
            --data-urlencode "clip_y=45" \
            --data-urlencode "clip_width=560" \
            --data-urlencode "clip_height=850" \
            --data-urlencode "block_ads=true" \
            --data-urlencode "block_cookie_banners=true" \
            --output sns-trend.jpg

      - name: Save screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sns-trend.jpg
          git commit -m "Update SNS trend screenshot" || true
          git push
