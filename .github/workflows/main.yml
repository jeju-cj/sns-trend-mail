name: SNS Trend Screenshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download screenshot and diagnose
        env:
          ACCESS_KEY: ${{ secrets.SCREENSHOTONE_ACCESS_KEY }}
        run: |
          URL="https://api.screenshotone.com/take?access_key=${ACCESS_KEY}&url=https%3A%2F%2Fclaude.ai%2Fartifact%2F661fBc9hrzkFAv3JvS8E7V&format=jpg&block_ads=true&block_cookie_banners=true&block_banners_by_heuristics=false&block_trackers=true&delay=0&timeout=60&response_type=by_format&image_quality=80&cache=false&clip_x=690&clip_y=45&clip_width=560&clip_height=850"

          curl --fail --location \
            --dump-header response-headers.txt \
            "$URL" \
            --output sns-trend-new.jpg

          echo "===== HTTP RESPONSE ====="
          cat response-headers.txt

          echo "===== FILE INFO ====="
          file sns-trend-new.jpg

          echo "===== FILE SIZE ====="
      
